<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Fighting - Turn-Based Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>OC Fighting - Character Matchup</h1>

        <div class="hero-section">
            <p class="hero-text">Choose two fighters and see how they stack up against each other!</p>
            <button id="randomize-btn" class="randomize-button">🎲 Random Matchup</button>
            <a href="character_showcase.html" class="randomize-button" style="margin-left: 20px; text-decoration: none;">👥 Character Showcase</a>
        </div>

        <div class="fighter-selection-grid">
            <div class="fighter-slot" id="fighter1-slot">
                <div class="custom-dropdown" id="fighter1-dropdown">
                    <div class="dropdown-header" onclick="matchupSystem.toggleDropdown('fighter1-dropdown')">
                        <span id="fighter1-selected-text">⚔️ Select Fighter 1</span>
                    </div>
                    <div class="dropdown-content">
                        <input type="text" id="fighter1-search" class="dropdown-search" placeholder="Search fighters..." oninput="matchupSystem.filterDropdown('fighter1-search', 'fighter1-dropdown')">
                        <div class="dropdown-options" id="fighter1-options">
                            <!-- Options will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="vs-divider">
                <div class="vs-circle">VS</div>
            </div>

            <div class="fighter-slot" id="fighter2-slot">
                <div class="custom-dropdown" id="fighter2-dropdown">
                    <div class="dropdown-header" onclick="matchupSystem.toggleDropdown('fighter2-dropdown')">
                        <span id="fighter2-selected-text">🛡️ Select Fighter 2</span>
                    </div>
                    <div class="dropdown-content">
                        <input type="text" id="fighter2-search" class="dropdown-search" placeholder="Search fighters..." oninput="matchupSystem.filterDropdown('fighter2-search', 'fighter2-dropdown')">
                        <div class="dropdown-options" id="fighter2-options">
                            <!-- Options will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="matchup-container" class="matchup-results">
            <!-- Matchup results will appear here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
